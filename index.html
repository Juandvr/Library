<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Library</title>
</head>
<body>
    <header>
        <h1>My Library</h1>
    </header>
    <main>
        <div class="side-panel">
            <div id="collections">
                <h2>Collections</h2>
            </div>
        </div>
        <button id="dialogBtn">+</button>
        <div id="library">
        </div>
        <dialog>
            <div class="modal-content">
                <form method="dialog">
                    <input type="text" placeholder="Title" name="title" id="title"><br><br>
                    <input type="text" placeholder="Author" name="author" id="author"><br><br>
                    <input type="text" placeholder="Pages" name="pages" id="pages"><br><br>
                    <input type="checkbox" id="status" name="status" value="read">
                    <label for="status">Have you read it?</label><br><br>
                    <button id="cancel">Cancel</button>
                    <button id="add">Save</button>
                </form>
            </div>
        </dialog>
    </main>
</body>
<script src="script.js"></script>
</html>
